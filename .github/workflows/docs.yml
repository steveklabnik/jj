name: website

on:
  schedule:
    # Prerelease docs are a weekly snapshot; releases still publish immediately.
    - cron: '23 8 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  prerelease-docs-build-deploy:
    permissions:
      contents: write
    if: github.repository_owner == 'jj-vcs' # Stops this job from running on forks
    concurrency:
      group: prerelease-docs
      cancel-in-progress: false
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          # `.github/scripts/docs-build-deploy` will need to `git push` to the docs branch
          persist-credentials: true
          # SOURCE_DATE_EPOCH needs the last docs change, not the latest commit.
          fetch-depth: 0
      - run:  "git fetch origin gh-pages --depth=1"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: 3.11
      - name: Install uv
        uses: astral-sh/setup-uv@eac588ad8def6316056a12d4907a9d4d84ff7a3b
        with:
          version: "0.5.1"
      - name: Install dependencies and compile MkDocs
        run: |
          git config user.name 'jj-docs[bot]'
          git config user.email 'jj-docs[bot]@users.noreply.github.io'
          export MKDOCS_SITE_NAME="Jujutsu docs (prerelease)"
          export MKDOCS_PRIMARY_COLOR="blue grey"
          .github/scripts/docs-build-deploy prerelease
      - name: Setup Node.js
        id: node
        continue-on-error: true
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238
        with:
          node-version: '22'
      - name: Build Starlight docs
        id: starlight
        if: steps.node.outcome == 'success'
        # Keep publishing MkDocs if the experimental comparison site is broken.
        continue-on-error: true
        working-directory: web/docs
        run: |
          npm ci
          npm run build -- --base /starlight/
      - name: Publish docs once
        env:
          STARLIGHT_OUTCOME: ${{ steps.starlight.outcome }}
        run: |
          if [ "$STARLIGHT_OUTCOME" = success ]; then
            .github/scripts/docs-publish web/docs/dist
          else
            .github/scripts/docs-publish
          fi
      - name: Report Starlight failure
        if: steps.node.outcome != 'success' || steps.starlight.outcome != 'success'
        run: |
          echo "::error::MkDocs publication completed; Starlight setup or build failed, so its previous published version was retained."
          exit 1
